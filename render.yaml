# Render blueprint — deploys the MatchingEngine API from the Dockerfile.
# In Render: New > Blueprint > pick this repo. Render reads this file.
#
# No ANTHROPIC_API_KEY is configured: every pair the API can serve is answered
# from the shipped cache (domains/housing/seed/bonus_cache.json), so the
# deployment never calls the LLM and holds no key to leak. To score pairs
# outside the cache, add the key in Render's Environment settings as a secret —
# never in this file.
services:
  - type: web
    name: matching-engine-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
